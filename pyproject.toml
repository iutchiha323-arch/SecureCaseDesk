[project]
name = "securecasedesk"
version = "2.2.0"
description = "منظومة محلية مشفرة لإدارة القضايا والملفات الأمنية"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "flet==0.28.3",
  "cryptography>=44.0.0,<47.0.0",
  "python-docx>=1.1.2,<2.0.0",
]

[tool.flet]
org = "com.securecasedesk"
bundle_id = "com.securecasedesk.app"
artifact = "SecureCaseDesk"
product = "SecureCaseDesk"
company = "SecureCaseDesk"
description = "منظومة إدارة القضايا والملفات الأمنية"
copyright = "Copyright 2026"

[tool.flet.app]
path = "src"

[tool.flet.android]
min_sdk_version = 23
