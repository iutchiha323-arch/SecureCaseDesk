name: Build APK and EXE

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet

      - name: Setup Android SDK (Manual)
        run: |
          # تثبيت نسخة محددة من أدوات سطر أوامر Android SDK لتجنب مشاكل التوافق
          export ANDROID_HOME=$HOME/.android/sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        run: |
          # استخدام sdkmanager المثبت حديثاً
          export ANDROID_HOME=$HOME/.android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          flet build apk --verbose --no-rich-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureCaseDesk-APK
          path: build/apk
          if-no-files-found: error

  build-exe:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet

      - name: Build EXE (Using flet pack)
        run: |
          # flet pack لا يحتاج إلى Visual Studio أو Flutter toolchain
          flet pack src/main.py --name SecureCaseDesk --product-name "SecureCaseDesk" --company "SecureCaseDesk" --yes

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SecureCaseDesk-Windows
          path: dist
          if-no-files-found: error