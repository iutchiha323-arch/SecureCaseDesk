name: Build SecureCaseDesk APK and EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK with Flet
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          working-directory: .
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SecureCaseDesk-Android-APK
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows application
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Windows app with Flet
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: windows
          working-directory: .
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: SecureCaseDesk-Windows
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
