name: Build APK and EXE

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet

      - name: Build APK
        run: |
          flet build apk --verbose --no-rich-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureCaseDesk-APK
          path: build/apk
          if-no-files-found: error

  build-exe:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet

      - name: Build EXE
        run: |
          flet build windows --verbose --no-rich-output

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SecureCaseDesk-Windows
          path: build/windows
          if-no-files-found: error
